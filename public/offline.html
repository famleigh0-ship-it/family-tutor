<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline — Family Tutor</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      p {
        max-width: 320px;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
      }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: 500;
        color: #ffffff;
        background: #1e40af;
        border: none;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <p>You're offline. Your progress is saved. Reconnect to continue your session.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </body>
</html>
